# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.15.0"

package:
  name: python-symengine
  version: ${{ version }}

source:
  url: https://github.com/symengine/symengine.py/releases/download/v${{ version }}/symengine.py-${{ version }}.tar.gz
  sha256: 5fac75a1b347308ba8b6e33b0bf74c5235446e268b3d023f80c02e1a873a7c18
  patches:
    # restore qualified Cython module name (from symengine/symengine-wheels)
    - 6344a52.patch

build:
  number: 0
  script:
    file: build-python-symengine

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake <4
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - cython >=3.1
        - cython-cmake
        - pip
        - python
        - scikit-build-core
        - setuptools-scm
    - if: unix
      then: make
      else: ninja
  host:
    - cython >=3.1
    - cython-cmake
    - gmp
    - libflint
    - mpc
    - mpfr
    - pip
    - python
    - scikit-build-core
    - setuptools-scm
    - symengine ${{ (version | split("."))[:2] | join(".") }}.*
  run:
    - python

tests:
  - python:
      imports: symengine
      pip_check: true
  - requirements:
      run:
        - pytest
        - sympy
    script:
      interpreter: python
      content: |
        import symengine
        if not symengine.test():
            raise Exception("Tests failed")

about:
  license: MIT
  license_file: LICENSE
  summary: Python wrappers for SymEngine, a fast symbolic manipulation library, written in C++
  homepage: https://pypi.org/project/symengine
  repository: https://github.com/symengine/symengine.py

extra:
  recipe-maintainers:
    - isuruf
    - certik
